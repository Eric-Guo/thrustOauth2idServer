# If you need to convert YAML to a Go struct, please execute the command: make update-config

# app settings
app:
  name: "thrustOauth2idServer"      # server name
  env: "dev"                     # runtime environment, dev: development environment, prod: production environment, test: test environment
  version: "v0.0.0"
  host: "127.0.0.1"              # domain or ip, for service registration
  enableStat: true               # whether to turn on printing statistics, true:enable, false:disable
  enableMetrics: true            # whether to turn on indicator collection, true:enable, false:disable
  enableHTTPProfile: false       # whether to turn on performance analysis, true:enable, false:disable
  enableLimit: false             # whether to turn on rate limiting (adaptive), true:on, false:off
  enableCircuitBreaker: false    # whether to turn on circuit breaker(adaptive), true:on, false:off
  enableTrace: false             # whether to turn on trace, true:enable, false:disable, if true jaeger configuration must be set
  tracingSamplingRate: 1.0       # tracing sampling rate, between 0 and 1, 0 means no sampling, 1 means sampling all links
  #registryDiscoveryType: ""      # registry and discovery types: consul, etcd, nacos, if empty, registration and discovery are not used
  cacheType: ""                  # cache type, if empty, the cache is not used, support for "memory" and "redis", if set to redis, must set redis configuration


# http server settings
http:
  port: 8080                # listen port
  httpsPort: 8443           # https listen port when tls is enabled
  timeout: 0                # request timeout, unit(second), if 0 means not set, if greater than 0 means set timeout, if enableHTTPProfile is true, it needs to set 0 or greater than 60s
  idleTimeout: 60           # http idle timeout, unit(second)
  readTimeout: 30           # http read timeout, unit(second)
  writeTimeout: 30          # http write timeout, unit(second)
  addRequestStartHeader: true # ensure X-Request-Start header is present on inbound requests
  gzipEnabled: true         # compress eligible API, Rails, and file responses
  gzipJitter: 32             # maximum gzip padding in bytes; 0 disables BREACH jitter
  gzipDisableOnAuth: false   # skip gzip for sensitive request/response headers
  maxRequestBodyBytes: 0    # maximum allowed request body in bytes; 0 disables the limit
  logRequests: true         # enable structured access logging
  tls:
    # TLS mode options:
    #   self-signed - use sponge managed localhost self-signed certificates
    #   encrypt     - use sponge Let's Encrypt integration, requires domain and email
    #   external    - use existing certFile and keyFile
    #   remote-api  - fetch certificate files from a remote API
    enableMode: ""          # empty disables tls
    domain: ""              # required when enableMode is encrypt; domains below is kept as a legacy alias
    domains:
      - ""                  # legacy alias; first non-empty value is used when domain is empty
    email: ""               # required when enableMode is encrypt
    certFile: ""            # required when enableMode is external
    keyFile: ""             # required when enableMode is external
    storagePath: "./storage/httpsrv" # certificate cache directory for sponge tls modes
    redirectHTTP: false     # encrypt mode only; redirect http.port traffic to HTTPS on httpsPort
    remoteAPI:
      url: ""               # required when enableMode is remote-api
      timeout: 5            # remote API timeout, unit(second)
      headers: {}           # optional request headers for remote-api mode

proxy:
  enabled: false            # when true, proxy unmatched requests to targetURL
  strategy: "round_robin"   # load balancing strategy: round_robin, least_connections, ip_hash
  xSendfileEnabled: true    # when true, translate X-Sendfile headers into direct file responses
  targetURL: "" # upstream url to proxy requests to, empty will using targetBindSocket in upstream
  forwardHeaders: true        # trust client X-Forwarded-* and X-Request-ID; set false when terminating public TLS
  badGatewayPage: "./public/502.html" # optional html page to serve on 502 errors
  # When enabled and targetURL is http (not https) and not using a UNIX socket,
  # the reverse proxy will use HTTP/2 prior-knowledge to the upstream.
  # See upstream discussion: https://github.com/basecamp/thruster/pull/89
  h2cEnabled: false
  healthCheck:
    intervalSeconds: 5      # proxykit active health check interval
    timeoutSeconds: 2       # proxykit health check timeout
  management:
    enabled: false          # expose proxykit management APIs when true
    basePath: "/proxykit"   # base path for add/remove/list proxy endpoints
  cache:
    enabled: true             # enable in-memory caching for cacheable responses
    capacityBytes: 67108864   # total bytes allocated for cached responses (64MB default)
    maxItemSizeBytes: 1048576 # maximum per-response size (1MB default)
    maxResponseBodyBytes: 1048576 # maximum body captured before skipping cache

upstream:
  enabled: false              # when true, launch and supervise a local upstream command
  command: "bin/rails"        # executable to run for the upstream Rails application (arguments may be included here)
  args:                       # optional arguments appended after parsing command; leave empty when command already contains them
    - "server"
  workingDirectory: ""        # change to rails app directory before starting the command
  targetPort: 3000            # port the upstream process should bind to; exported as PORT, if targetBindSocket set, will using socket first
  targetBindSocket: ""       # optional UNIX socket path, e.g. unix:///tmp/puma.sock
  stopSignal: "SIGTERM"       # signal sent when shutting down; defaults to SIGTERM if empty
  env: {}                     # additional environment variables passed to the upstream process
    # RAILS_ENV: "development"

# rails cookie auth settings
rails:
  secretKeyBase: "change-me"      # run rails credentials:show to get secret_key_base
  cookieName: "_oauth2id_session" # find in config/initializers/session_store.rb or via browser
  userID: 1 # eric@cloud-mes.com


# jwt settings
jwt:
  signingKey: "change-me"    # jwt signing key for token validation and generation
  expire: 86400              # token expiry seconds (24h)

# logger settings
logger:
  level: "info"             # output log levels debug, info, warn, error, default is debug
  format: "console"         # output format, console or json, default is console
  isSave: false             # false:output to terminal, true:output to file, default is false
  #logFileConfig:           # Effective when isSave=true
    #filename: "out.log"    # File name (default is out.log)
    #maxSize: 20            # Maximum file size (MB, default is 10MB)
    #maxBackups: 50         # Maximum number of old files to retain (default is 100)
    #maxAge: 15             # Maximum number of days to retain old files (default is 30 days)
    #isCompression: true    # Whether to compress/archive old files (default is false)


database:
  driver: "sqlite"      # database driver
  # sqlite settings
  sqlite:
    dbFile: "/Users/guochunzhong/git/sso/oauth2id/storage/oauth2id_dev.sqlite3"
    enableLog: true         # whether to turn on printing of all logs
    maxIdleConns: 10        # set the maximum number of connections in the idle connection pool
    maxOpenConns: 100       # set the maximum number of open database connections
    connMaxLifetime: 30     # sets the maximum time for which the connection can be reused, in minutes


# redis settings
redis:
  # dsn format, [user]:<pass>@127.0.0.1:6379/[db], the default user is default, redis version 6.0 and above only supports user.
  dsn: "default:123456@192.168.3.37:6379/0"
  dialTimeout: 10           # connection timeout, unit(second)
  readTimeout: 2            # read timeout, unit(second)
  writeTimeout: 2           # write timeout, unit(second)


# jaeger settings
jaeger:
  agentHost: "192.168.3.37"
  agentPort: 6831
